{% extends "base.html" %}
{% block content %}
<div class="row g-2 mb-3 text-center">
  <div class="col-4"><div class="card card-body stat"><b>{{ h.bmi }}</b><small>BMI ({{ h.kat }})</small></div></div>
  <div class="col-4"><div class="card card-body stat"><b>{{ h.tdee }}</b><small>Kebutuhan energi (kkal)</small></div></div>
  <div class="col-4"><div class="card card-body stat"><b>{{ h.kal }}</b><small>Target kkal/hari</small></div></div>
</div>
{% for c in h.cat %}<div class="alert alert-warning">{{ c }}</div>{% endfor %}
<form method="post" class="card card-body shadow-sm border-0">
  <h2 class="h5 mb-3">Data profil</h2>
  {% include "_form.html" %}
  <button class="btn btn-nutri mt-4">Simpan perubahan</button>
</form>
<form method="post" action="{{ url_for('reset') }}" class="mt-3" onsubmit="return confirm('Hapus profil dan mulai dari awal?')">
  <button class="btn btn-outline-secondary w-100">Hapus profil</button>
</form>
{% endblock %}
