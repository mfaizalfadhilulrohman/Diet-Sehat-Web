<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diet Sehat – Asisten Gizi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>
  <nav class="navbar nav-nutri">
    <div class="container nav-inner" style="max-width:1100px">
      <a class="navbar-brand fw-bold text-white" href="{{ url_for('index') }}">🥗 Diet Sehat</a>
      {% if session.get('profil') %}
      <div class="btn-group btn-group-sm">
        <a class="btn btn-light {{ 'active' if request.endpoint == 'jadwal' }}" href="{{ url_for('jadwal') }}">Jadwal</a>
        <a class="btn btn-light {{ 'active' if request.endpoint == 'chat' }}" href="{{ url_for('chat') }}">Cari Menu</a>
        <a class="btn btn-light {{ 'active' if request.endpoint == 'profil' }}" href="{{ url_for('profil') }}">Profil</a>
      </div>
      {% endif %}
    </div>
  </nav>
  <main class="container py-4" style="max-width:1100px">
    {% for kategori, pesan in get_flashed_messages(with_categories=true) %}
      <div class="alert alert-{{ kategori }}">{{ pesan }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
    <p class="text-center text-muted small mt-4">Edukasi, bukan pengganti dokter atau ahli gizi.</p>
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
